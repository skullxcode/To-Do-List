<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h1>To-Do List</h1>
    </nav>
    <main>
        <input type="text" name="" id="search-bar" placeholder="Search">
        <div id="add-tasks-container">
            <h2 id="add-tasks-heading">Add Tasks</h2>
            <input type="text" id="add-tasks-input" placeholder="Add new task." required>
            <div id="tags-box">
                <input type="text" id="new-tag" placeholder="Add new tag.">
                <button onclick="addTags()">Add Tag</button>
                <input type="date" id="date-input" required>
                <ul id="tags-list" style="list-style-type: none;">
                </ul>
            </div>
            <button onclick="cancelEdit()" id="cancel-edit-button">Cancel</button>
            <button onclick="addTask()" id="add-task-button">Add Task</button>

        </div>
        <div id="tasks-in-progress-container">
            <h2>Tasks In Progress</h2>
            <ul style="list-style-type: none;" id="tasks-in-progress-list">
            </ul>
        </div>
        <div id="completed-tasks-container">
            <h2>Completed Tasks</h2>
            <ul style="list-style-type: none;" id="completed-tasks-list">

            </ul>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
